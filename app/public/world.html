<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Endless — the cockpit</title>
<style>
  :root{ --accent:#ED7100; --hud:rgba(255,190,120,.85); --dim:rgba(160,150,145,.6); --dust:#c98a3a; }
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{margin:0;background:#04040a;color:#ececf0;
       font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
       -webkit-user-select:none;user-select:none}
  canvas{display:block;position:fixed;inset:0;touch-action:none}

  /* ---------------------------------------------------------------- canopy
     The hull, over the glass. It catches nothing: a frame that ate a tap meant
     for a world behind it would be a cockpit you cannot fly. */
  .canopy{position:fixed;inset:0;pointer-events:none;z-index:4}
  .canopy .glass{position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(255,150,60,.045) 0%, transparent 20%)}
  .strut.l{position:absolute;left:0;top:0;bottom:0;width:13vw;
    background:linear-gradient(90deg,rgba(17,14,13,.97) 0%,rgba(22,18,16,.66) 52%,transparent 100%)}
  .strut.r{position:absolute;right:0;top:0;bottom:0;width:13vw;
    background:linear-gradient(270deg,rgba(17,14,13,.97) 0%,rgba(22,18,16,.66) 52%,transparent 100%)}
  .strut.t{position:absolute;left:0;right:0;top:0;height:8vh;
    background:linear-gradient(180deg,rgba(15,12,11,.98) 0%,rgba(20,16,15,.5) 62%,transparent 100%)}
  .dash{position:absolute;left:0;right:0;bottom:0;height:18vh;
    background:linear-gradient(0deg,#0a0807 0%,#141110 56%,rgba(23,18,16,.7) 86%,transparent 100%);
    border-top:1px solid rgba(237,113,0,.26);
    box-shadow:0 -14px 46px rgba(237,113,0,.08)}
  .dash:after{content:"";position:absolute;left:10%;right:10%;top:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,190,120,.55),transparent)}

  /* ---------------------------------------------------------------- readouts */
  .hud{position:fixed;z-index:6;pointer-events:none;
    font:11px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.09em;text-transform:uppercase;color:var(--hud);
    text-shadow:0 0 12px rgba(237,113,0,.4)}
  .hud .lbl{color:var(--dim);letter-spacing:.14em}
  .hud b{font-weight:600;color:#ffe2bd}
  #hudL{left:calc(2vw + 10px);bottom:4.5vh}
  #hudR{right:calc(2vw + 10px);bottom:4.5vh;text-align:right}
  .bar{width:104px;height:3px;background:rgba(255,190,120,.15);border-radius:2px;margin-top:3px}
  .bar i{display:block;height:100%;width:0;background:var(--hud);border-radius:2px;
    box-shadow:0 0 9px rgba(255,190,120,.8);transition:width .12s linear}
  #hudR .bar{margin-left:auto}

  /* throttle — a real control, so it does take pointer events */
  .throttle{margin-top:7px;display:flex;gap:4px;pointer-events:auto;justify-content:flex-end}
  .throttle button{padding:4px 9px;border-radius:5px;cursor:pointer;
    border:1px solid rgba(237,113,0,.32);background:rgba(12,9,8,.75);color:var(--dim);
    font:10px/1 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}
  .throttle button[aria-pressed="true"]{background:rgba(237,113,0,.9);color:#140d06;
    border-color:rgba(255,190,120,.8);font-weight:700}

  /* ---------------------------------------------------------------- console */
  .console{position:fixed;left:50%;transform:translateX(-50%);bottom:5.2vh;z-index:7;
    width:min(560px,78vw);display:flex;flex-direction:column;gap:7px;align-items:center}
  .ask{display:flex;gap:7px;width:100%}
  .ask input{flex:1;min-width:0;padding:11px 15px;border-radius:9px;
    border:1px solid rgba(237,113,0,.32);background:rgba(10,8,10,.88);color:#ffe2bd;
    font:13px ui-monospace,SFMono-Regular,Menlo,monospace;
    box-shadow:inset 0 0 22px rgba(237,113,0,.06)}
  .ask input::placeholder{color:rgba(160,150,145,.5)}
  .ask input:focus{outline:0;border-color:rgba(255,190,120,.7)}
  .ask button{padding:11px 19px;border-radius:9px;border:1px solid rgba(237,113,0,.5);
    background:rgba(237,113,0,.9);color:#140d06;font:600 12px/1 ui-monospace,monospace;
    letter-spacing:.13em;text-transform:uppercase;cursor:pointer}
  .ask button:disabled{opacity:.4;cursor:default}
  .status{font:11px/1.5 ui-monospace,monospace;letter-spacing:.11em;text-transform:uppercase;
    color:var(--hud);min-height:1.3em;text-align:center;text-shadow:0 0 14px rgba(237,113,0,.5)}

  /* ---------------------------------------------------------------- panel */
  .panel{position:fixed;left:50%;transform:translateX(-50%) translateY(calc(100% + 60px));
    bottom:calc(5.2vh + 92px);width:min(560px,86vw);max-height:52vh;overflow:auto;z-index:8;
    background:rgba(9,8,12,.95);border:1px solid rgba(237,113,0,.28);border-radius:13px;
    padding:16px 18px;backdrop-filter:blur(10px);
    box-shadow:0 0 44px rgba(0,0,0,.75), inset 0 0 40px rgba(237,113,0,.045);
    transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .panel.up{transform:translateX(-50%) translateY(0)}
  .panel .q{font:11px/1.6 ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase;
    color:var(--dim);margin:0 0 8px}
  .panel .a{font-size:.97rem;line-height:1.62;margin:0 0 11px;color:#f0eae4}
  .panel .via{font:10px/1.6 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;
    color:var(--dim);margin:0}
  .panel .via b{color:var(--hud)}
  .panel .gap{border-left:2px solid var(--dust);padding-left:11px;color:var(--dust);font-size:.87rem}
  details{margin-top:11px}
  summary{font:10px/1.6 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;
    color:var(--dim);cursor:pointer;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary:before{content:"> ";color:var(--accent)}
  details[open] summary:before{content:"v ";color:var(--accent)}
  pre{margin:8px 0 0;background:#070609;border:1px solid rgba(237,113,0,.14);border-radius:7px;
    padding:10px;font:11px/1.55 ui-monospace,monospace;color:#b9d8c6;
    white-space:pre-wrap;word-break:break-word;max-height:24vh;overflow:auto}
  .panel .row{display:flex;gap:7px;margin-top:11px}
  .panel .row button{padding:8px 14px;border-radius:7px;border:1px solid rgba(237,113,0,.38);
    background:transparent;color:var(--hud);font:11px ui-monospace,monospace;
    letter-spacing:.09em;text-transform:uppercase;cursor:pointer}

  .brand{position:fixed;top:2.2vh;left:50%;transform:translateX(-50%);z-index:6;
    font:11px/1.6 ui-monospace,monospace;letter-spacing:.3em;text-transform:uppercase;
    color:rgba(255,190,120,.45);pointer-events:none;text-align:center}
  .brand a{color:rgba(160,150,145,.5);pointer-events:auto;letter-spacing:.1em;text-decoration:none}

  .boot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#04040a;
    font:12px ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--hud);
    transition:opacity .7s}
  .boot.gone{opacity:0;pointer-events:none}

  @media (max-width:640px){
    .strut.l,.strut.r{width:7vw}
    .hud{font-size:10px}
    #hudL,#hudR{bottom:3.2vh}
    .console{bottom:3.8vh;width:88vw}
    .brand{font-size:9px}
    .bar{width:78px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="canopy">
  <div class="glass"></div>
  <div class="strut t"></div>
  <div class="strut l"></div>
  <div class="strut r"></div>
  <div class="dash"></div>
</div>

<div class="brand">ENDLESS<br><a href="/">plain page</a> · <a href="/flat">flat map</a></div>

<div class="hud" id="hudL">
  <div class="lbl">tether</div>
  <div><b id="tState">MOORED</b></div>
  <div class="lbl">range to claude</div>
  <div><b id="tRange">0</b></div>
  <div class="bar"><i id="tBar"></i></div>
</div>

<div class="hud" id="hudR">
  <div class="lbl">heading</div>
  <div><b id="tTarget">HOLDING</b></div>
  <div class="lbl">velocity</div>
  <div><b id="tVel">0</b></div>
  <div class="bar"><i id="vBar"></i></div>
  <div class="throttle" id="throttle">
    <button data-sp="0.55" aria-pressed="false">Drift</button>
    <button data-sp="1" aria-pressed="true">Cruise</button>
    <button data-sp="2.1" aria-pressed="false">Burn</button>
  </div>
</div>

<div class="console">
  <div class="ask">
    <input id="q" placeholder="ask anything — how strong is charizard?" autocomplete="off" spellcheck="false">
    <button id="go">Ask</button>
  </div>
  <div class="status" id="status"></div>
</div>

<div class="panel" id="panel"></div>
<div class="boot" id="boot">bringing systems up…</div>

<script type="module">
// THE COCKPIT.
//
// WHY NOT UNREAL. Asked for, and the wrong tool rather than a missing one.
// Unreal has had no browser target since HTML5 export was removed after 4.24,
// so the only route onto a page is Pixel Streaming: render on a GPU server and
// send video. About $380 a month for the smallest suitable AWS instance
// against $0 here, a session per viewer, and a phone on mobile data would get
// a laggy video OF a cockpit. three.js renders on the device in your hand.
//
// three.js is vendored rather than CDN-loaded, because this page's CSP says
// script-src 'self' and relaxing it on a page holding an API key is a bad
// trade for saving two megabytes.
//
// THE POST-PROCESSING IS HAND-WRITTEN, not three's UnrealBloomPass. That pass
// needs eight more vendored addon files and an import map, and it is built to
// bloom anything. This scene has exactly one very bright thing in it, so a
// tuned bright-pass plus two blurs at quarter resolution gets a better result
// for a fraction of the fill rate — which matters, because the target device
// is a phone.

import * as T from "/vendor/three.module.js";

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;

// Smootherstep: zero velocity AND zero acceleration at both ends. The old
// cubic ease started moving abruptly enough to read as a cut on short hops.
const ease = (t) => t * t * t * (t * (t * 6 - 15) + 10);

function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0);
}
// A seeded generator, so a world's surface is the same every visit. Procedural
// texture from Math.random would repaint every planet on reload.
function rng(seed) {
  let x = seed >>> 0;
  return () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return ((x >>> 0) % 100000) / 100000; };
}

// ---------------------------------------------------------------- renderer
const renderer = new T.WebGLRenderer({ canvas: $("#c"), antialias: false, powerPreference: "high-performance" });
// Capped below 2 even on a retina phone: the bloom chain costs fill rate, and
// a sharper image at 20fps reads worse than a softer one at 60.
const DPR = Math.min(devicePixelRatio || 1, innerWidth < 700 ? 1.5 : 1.85);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.autoClear = false;

const scene = new T.Scene();
const camera = new T.PerspectiveCamera(60, innerWidth / innerHeight, 0.5, 30000);

// Parked close: the hole should fill the glass the moment the page opens, and
// this is the mooring the ship returns to.
const MOORING = new T.Vector3(0, 14, 66);
camera.position.copy(MOORING);

scene.add(new T.AmbientLight(0x2e3048, 1.0));
const keyLight = new T.PointLight(0xffb066, 2200, 3000, 2);
scene.add(keyLight);
// A cold fill from behind, so an unlit world has a rim instead of vanishing
// into the background entirely.
const rim = new T.DirectionalLight(0x7088c0, 0.5);
rim.position.set(-1, .5, -1);
scene.add(rim);

// ---------------------------------------------------------------- textures
function softDot(inner, outer) {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const x = c.getContext("2d");
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, inner); g.addColorStop(.42, outer); g.addColorStop(1, "rgba(0,0,0,0)");
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  const t = new T.CanvasTexture(c); t.minFilter = T.LinearFilter; return t;
}
const DOT = softDot("rgba(255,255,255,1)", "rgba(255,255,255,.35)");

const glowTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const x = c.getContext("2d");
  const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, "rgba(255,255,255,.95)");
  g.addColorStop(.22, "rgba(255,200,140,.42)");
  g.addColorStop(1, "rgba(237,113,0,0)");
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  return new T.CanvasTexture(c);
})();

// A SURFACE, NOT A FLAT COLOUR. Bands plus blotches plus a terminator's worth
// of shading detail. Cheap — 256x128 per tool, generated once — and it is the
// difference between a sphere and a ball.
function planetTexture(seed, hue, lit) {
  const W = 256, H = 128;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  const r = rng(seed);
  const sat = lit ? 46 : 10, light = lit ? 44 : 20;
  x.fillStyle = `hsl(${hue * 360},${sat}%,${light}%)`;
  x.fillRect(0, 0, W, H);
  // Latitude bands, drifting in width, so it reads as atmosphere or strata.
  let y = 0;
  while (y < H) {
    const h = 4 + r() * 16;
    const l = light + (r() * 2 - 1) * (lit ? 13 : 6);
    const hh = (hue * 360 + (r() * 2 - 1) * 22 + 360) % 360;
    x.fillStyle = `hsl(${hh},${sat}%,${Math.max(4, Math.min(72, l))}%)`;
    x.fillRect(0, y, W, h + 1);
    y += h;
  }
  // Blotches: storms on a lit world, craters on a dead one.
  for (let i = 0; i < 26; i++) {
    const cx = r() * W, cy = r() * H, rad = 3 + r() * 15;
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, rad);
    const l = light + (r() * 2 - 1) * (lit ? 20 : 9);
    g.addColorStop(0, `hsla(${hue * 360},${sat}%,${Math.max(3, Math.min(80, l))}%,.72)`);
    g.addColorStop(1, `hsla(${hue * 360},${sat}%,${light}%,0)`);
    x.fillStyle = g;
    x.beginPath(); x.ellipse(cx, cy, rad * 1.5, rad, 0, 0, TAU); x.fill();
  }
  const t = new T.CanvasTexture(c);
  t.colorSpace = T.SRGBColorSpace;
  t.wrapS = T.RepeatWrapping;
  return t;
}

// ---------------------------------------------------------------- backdrop
// A nebula on the inside of a very large sphere. Without it the sky is black
// and every sense of depth comes from the stars alone, which is not enough to
// tell a slow approach from a still image.
{
  const W = 1024, H = 512;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  x.fillStyle = "#04040a"; x.fillRect(0, 0, W, H);
  const r = rng(99173);
  const tints = ["255,120,40", "140,90,220", "40,120,210", "210,70,120"];
  for (let i = 0; i < 46; i++) {
    const cx = r() * W, cy = r() * H, rad = 70 + r() * 260;
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, rad);
    const tint = tints[(i * 7) % tints.length];
    g.addColorStop(0, `rgba(${tint},${.040 + r() * .055})`);
    g.addColorStop(1, `rgba(${tint},0)`);
    x.fillStyle = g;
    x.beginPath(); x.ellipse(cx, cy, rad, rad * (.5 + r() * .7), r() * TAU, 0, TAU); x.fill();
  }
  const tex = new T.CanvasTexture(c);
  tex.colorSpace = T.SRGBColorSpace;
  const sky = new T.Mesh(
    new T.SphereGeometry(14000, 32, 20),
    new T.MeshBasicMaterial({ map: tex, side: T.BackSide, depthWrite: false }));
  scene.add(sky);
}

// ---------------------------------------------------------------- starfield
// Two populations. Distant ones are small and cold; a scattered few are near,
// larger and warmer, and those are what give parallax something to work on.
for (const [N, size, dist, opacity] of [[3000, 5.5, 9000, .7], [320, 16, 4200, .95]]) {
  const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  const r = rng(N * 31 + 7);
  for (let i = 0; i < N; i++) {
    const u = r() * 2 - 1, th = r() * TAU, rad = dist * (.6 + r() * .6);
    const k = Math.sqrt(1 - u * u);
    pos[i*3] = Math.cos(th) * k * rad; pos[i*3+1] = u * rad; pos[i*3+2] = Math.sin(th) * k * rad;
    const warm = r();
    const c = new T.Color().setHSL(warm < .72 ? .58 + r() * .07 : .07 + r() * .06, .35 + r() * .4, .72 + r() * .26);
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  const g = new T.BufferGeometry();
  g.setAttribute("position", new T.BufferAttribute(pos, 3));
  g.setAttribute("color", new T.BufferAttribute(col, 3));
  scene.add(new T.Points(g, new T.PointsMaterial({
    map: DOT, size, vertexColors: true, transparent: true, opacity,
    sizeAttenuation: true, depthWrite: false, blending: T.AdditiveBlending,
  })));
}

// ---------------------------------------------------------------- black hole
const HORIZON = 7;
const hole = new T.Group();
scene.add(hole);

// Unlit black, so it stays a HOLE rather than becoming a dark ball with a
// highlight sliding across it. Rendered after the disc's far half.
hole.add(new T.Mesh(new T.SphereGeometry(HORIZON, 56, 36),
  new T.MeshBasicMaterial({ color: 0x000000 })));

const photon = new T.Mesh(
  new T.TorusGeometry(HORIZON * 1.065, .10, 14, 200),
  new T.MeshBasicMaterial({ color: 0xfff0d8, transparent: true, opacity: 1,
    blending: T.AdditiveBlending, depthWrite: false }));
photon.rotation.x = Math.PI / 2;
hole.add(photon);

// The disc is PARTICLES because the inner edge must visibly outrun the outer
// one, and a rigid mesh cannot do that. Kepler: omega falls off as r^-1.5.
const DISC_N = innerWidth < 700 ? 4200 : 7000;
const discPos = new Float32Array(DISC_N * 3);
const discCol = new Float32Array(DISC_N * 3);
const discDat = new Float32Array(DISC_N * 3);   // r, angle, rate
{
  const cIn = new T.Color(0xfffaf0), cMid = new T.Color(0xffb257), cOut = new T.Color(0x9c3406);
  const r = rng(4242);
  for (let i = 0; i < DISC_N; i++) {
    const rad = HORIZON * 1.3 + Math.pow(r(), .55) * HORIZON * 4.6;
    discDat[i*3] = rad; discDat[i*3+1] = r() * TAU;
    discDat[i*3+2] = 2.3 / Math.pow(rad / (HORIZON * 1.3), 1.5);
    const heat = 1 - Math.min(1, (rad - HORIZON * 1.3) / (HORIZON * 4.6));
    const c = heat > .55 ? cIn.clone().lerp(cMid, (1 - heat) / .45)
                         : cMid.clone().lerp(cOut, (.55 - heat) / .55);
    discCol[i*3] = c.r; discCol[i*3+1] = c.g; discCol[i*3+2] = c.b;
  }
}
const discGeo = new T.BufferGeometry();
discGeo.setAttribute("position", new T.BufferAttribute(discPos, 3));
discGeo.setAttribute("color", new T.BufferAttribute(discCol, 3));
hole.add(new T.Points(discGeo, new T.PointsMaterial({
  map: DOT, size: 1.25, vertexColors: true, transparent: true, opacity: .95,
  blending: T.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
})));

const glow = new T.Sprite(new T.SpriteMaterial({
  map: glowTex, blending: T.AdditiveBlending, depthWrite: false, transparent: true, color: 0xffa347,
}));
glow.scale.set(HORIZON * 11, HORIZON * 11, 1);
hole.add(glow);

// ---------------------------------------------------------------- labels
function labelSprite(text, colour, px) {
  const size = px ?? 40, pad = 14;
  const m = document.createElement("canvas").getContext("2d");
  m.font = `600 ${size}px ui-monospace, SFMono-Regular, Menlo, monospace`;
  const w = Math.ceil(m.measureText(text).width) + pad * 2;
  const c = document.createElement("canvas");
  c.width = w; c.height = size + 22;
  const g = c.getContext("2d");
  g.font = `600 ${size}px ui-monospace, SFMono-Regular, Menlo, monospace`;
  g.textBaseline = "middle";
  g.shadowColor = "rgba(0,0,0,.95)"; g.shadowBlur = 12;
  g.fillStyle = colour;
  g.fillText(text, pad, c.height / 2);
  const tex = new T.CanvasTexture(c);
  tex.minFilter = T.LinearFilter;
  const sp = new T.Sprite(new T.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sp.scale.set(w / c.height * 10, 10, 1);
  return sp;
}

// ---------------------------------------------------------------- the worlds
const bodies = [];
const gapClouds = [];
const home = new T.Vector3(0, 0, 0);

const bodyPos = (b) => new T.Vector3(
  Math.cos(b.a) * b.R, Math.sin(b.inc) * b.R * .32, Math.sin(b.a) * b.R);

async function load() {
  const [tj, gj] = await Promise.all([
    fetch("/api/board?file=tools").then(r => r.json()).catch(() => ({ tools: [] })),
    fetch("/api/board?file=gaps").then(r => r.json()).catch(() => ({ clusters: [] })),
  ]);

  const tools = tj.tools ?? [];
  const maxMass = Math.max(1, ...tools.map(t => t.live_mass ?? 0));
  const sorted = [...tools].sort((a, b) => (b.live_mass ?? 0) - (a.live_mass ?? 0));

  sorted.forEach((t, i) => {
    const h = hash(t.tool_id);
    const busy = Math.min(1, (t.live_mass ?? 0) / maxMass);
    const jitter = .74 + ((h >> 9) % 1000) / 1000 * .44;
    // Busy close in, quiet far out. Radius already encoded use and decay
    // already pushes an unused tool outward, so the orbit a tool sits in IS
    // its standing rather than a decoration laid over the data.
    const R = lerp(100, 380, Math.pow(1 - busy, .85)) * jitter;
    const a = i * 2.39996 + ((h % 1000) / 1000) * .5;
    const inc = ((h >> 4) % 1000) / 1000 * .36 - .18;

    const lit = t.brightness != null && (t.mass ?? 0) > 0;
    const radius = 3.6 + Math.sqrt(t.live_mass ?? 0) * 2.8;
    const hue = ((h >> 3) % 360) / 360;

    const mat = new T.MeshStandardMaterial({
      map: planetTexture(h, hue, lit),
      roughness: lit ? .72 : .95,
      metalness: lit ? .06 : .02,
      // Unlit is its own state, not a dim version of lit. Nothing is KNOWN
      // about whether these work, and drawing "no evidence" the same as "weak
      // evidence" would be the most misleading thing on the screen.
      emissive: lit ? new T.Color().setHSL(hue, .7, .10 + (t.brightness ?? 0) * .13) : new T.Color(0x05050a),
    });

    const group = new T.Group();
    const mesh = new T.Mesh(new T.SphereGeometry(radius, 40, 26), mat);
    group.add(mesh);

    if (lit) {
      const hl = new T.Sprite(new T.SpriteMaterial({
        map: glowTex, blending: T.AdditiveBlending, depthWrite: false, transparent: true,
        color: new T.Color().setHSL(hue, .85, .6), opacity: .4 + (t.brightness ?? 0) * .3,
      }));
      hl.scale.set(radius * 8.5, radius * 8.5, 1);
      group.add(hl);
    }

    const lab = labelSprite(t.name ?? t.tool_id, lit ? "#ffe2bd" : "#8f8fa2");
    lab.position.y = radius + 8;
    group.add(lab);

    const moons = [];
    for (let k = 0; k < Math.min(t.dependents ?? 0, 3); k++) {
      const m = new T.Mesh(new T.SphereGeometry(Math.max(.9, radius * .3), 18, 12),
        new T.MeshStandardMaterial({ color: 0xcfd6ea, roughness: .78 }));
      group.add(m);
      moons.push({ mesh: m, d: radius * 2.8 + k * radius, a: ((h >> (k + 2)) % 628) / 100, rate: .55 - k * .13 });
    }

    scene.add(group);
    bodies.push({ ...t, group, mesh, moons, lit, radius, R, a, inc, rate: 30 / Math.pow(R, 1.5), pulse: 0 });
  });

  (gj.clusters ?? []).forEach((cl) => {
    const h = hash(cl.id);
    const a = (h % 1000) / 1000 * TAU;
    const R = 460 + ((h >> 7) % 160);
    addGapCloud(
      new T.Vector3(Math.cos(a) * R, ((((h >> 5) % 100) / 100) - .5) * 90, Math.sin(a) * R),
      cl.label ?? "a need nobody met", cl.confirmed === true);
  });
}

function addGapCloud(centre, label, confirmed) {
  const N = confirmed ? 1100 : 760;
  const pos = new Float32Array(N * 3);
  const r = rng(hash(String(label)));
  for (let i = 0; i < N; i++) {
    const u = r() * 2 - 1, th = r() * TAU;
    // A confirmed cluster is tighter: asked enough times to have begun
    // collapsing toward something buildable.
    const rad = (confirmed ? 7 : 12) + Math.pow(r(), .5) * (confirmed ? 20 : 34);
    const k = Math.sqrt(1 - u * u);
    pos[i*3] = centre.x + Math.cos(th) * k * rad;
    pos[i*3+1] = centre.y + u * rad * .6;
    pos[i*3+2] = centre.z + Math.sin(th) * k * rad;
  }
  const g = new T.BufferGeometry();
  g.setAttribute("position", new T.BufferAttribute(pos, 3));
  scene.add(new T.Points(g, new T.PointsMaterial({
    map: DOT, color: 0xd09a4a, size: confirmed ? 2.6 : 2.0, transparent: true,
    opacity: confirmed ? .6 : .36, blending: T.AdditiveBlending, depthWrite: false,
  })));
  const lab = labelSprite(String(label).slice(0, 34), "#c98a3a", 32);
  lab.position.copy(centre); lab.position.y += 36;
  scene.add(lab);
  gapClouds.push({ centre, confirmed });
}

// ---------------------------------------------------------------- the open web
// NOT A PLANET, deliberately. Every other body is a reviewed tool with a
// handler and a version. This is the open internet: it runs inside the model's
// API, nobody here wrote it or approved it, and what comes back is whatever
// the web said today. So it is weather — a haze that never resolves.
const webCloud = (() => {
  const group = new T.Group();
  const N = 2600, pos = new Float32Array(N * 3);
  const r = rng(8812);
  for (let i = 0; i < N; i++) {
    const u = r() * 2 - 1, th = r() * TAU, rad = Math.pow(r(), .42) * 26;
    const k = Math.sqrt(1 - u * u);
    pos[i*3] = Math.cos(th) * k * rad; pos[i*3+1] = u * rad * .8; pos[i*3+2] = Math.sin(th) * k * rad;
  }
  const g = new T.BufferGeometry();
  g.setAttribute("position", new T.BufferAttribute(pos, 3));
  group.add(new T.Points(g, new T.PointsMaterial({
    map: DOT, color: 0x7fc4ff, size: 2.4, transparent: true, opacity: .38,
    blending: T.AdditiveBlending, depthWrite: false,
  })));
  const hl = new T.Sprite(new T.SpriteMaterial({
    map: glowTex, blending: T.AdditiveBlending, depthWrite: false,
    transparent: true, color: 0x66b0ff, opacity: .3 }));
  hl.scale.set(120, 120, 1);
  group.add(hl);
  const lab = labelSprite("the open web", "#9fd4ff");
  lab.position.y = 42;
  group.add(lab);
  scene.add(group);
  return { group, R: 300, a: 2.1, inc: .22, rate: 30 / Math.pow(300, 1.5), radius: 26 };
})();

// ---------------------------------------------------------------- the tether
//
// Never not drawn. The ship goes out to a tool and comes back, and the line
// home says why: a tool is not where the answer lives, it is somewhere the
// model reached. Cut the tether and a tool is just an API.
const tetherGeo = new T.BufferGeometry();
tetherGeo.setAttribute("position", new T.BufferAttribute(new Float32Array(6), 3));
const tether = new T.Line(tetherGeo, new T.LineBasicMaterial({
  color: 0xffc078, transparent: true, opacity: .5, blending: T.AdditiveBlending, depthWrite: false }));
scene.add(tether);

// ---------------------------------------------------------------- post
//
// Render to a target, pull out the bright parts at quarter resolution, blur
// them twice, then composite with the lensing warp. Four small shaders.
function rt(w, h) {
  return new T.WebGLRenderTarget(Math.max(2, w | 0), Math.max(2, h | 0), {
    minFilter: T.LinearFilter, magFilter: T.LinearFilter,
    type: T.HalfFloatType, depthBuffer: true,
  });
}
let rtScene, rtA, rtB;
function sizeTargets() {
  const w = innerWidth * DPR, h = innerHeight * DPR;
  rtScene?.dispose(); rtA?.dispose(); rtB?.dispose();
  rtScene = rt(w, h);
  rtA = rt(w / 4, h / 4);
  rtB = rt(w / 4, h / 4);
}
sizeTargets();

const fsScene = new T.Scene();
const fsCam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const fsQuad = new T.Mesh(new T.PlaneGeometry(2, 2), new T.MeshBasicMaterial());
fsScene.add(fsQuad);
function pass(mat, target) {
  fsQuad.material = mat;
  renderer.setRenderTarget(target ?? null);
  renderer.clear();
  renderer.render(fsScene, fsCam);
}

const VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`;

const brightMat = new T.ShaderMaterial({
  uniforms: { tDiffuse: { value: null }, threshold: { value: 0.62 } },
  vertexShader: VERT,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float threshold; varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      float l = dot(c, vec3(.2126,.7152,.0722));
      // Soft knee, so a surface just under the cut does not pop as it crosses.
      float k = smoothstep(threshold, threshold + .35, l);
      gl_FragColor = vec4(c * k, 1.);
    }`,
});

const blurMat = new T.ShaderMaterial({
  uniforms: { tDiffuse: { value: null }, dir: { value: new T.Vector2(1, 0) }, res: { value: new T.Vector2() } },
  vertexShader: VERT,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 dir; uniform vec2 res; varying vec2 vUv;
    void main(){
      vec2 px = dir / res;
      vec3 s = texture2D(tDiffuse, vUv).rgb * .2270270270;
      s += texture2D(tDiffuse, vUv + px * 1.3846153846).rgb * .3162162162;
      s += texture2D(tDiffuse, vUv - px * 1.3846153846).rgb * .3162162162;
      s += texture2D(tDiffuse, vUv + px * 3.2307692308).rgb * .0702702703;
      s += texture2D(tDiffuse, vUv - px * 3.2307692308).rgb * .0702702703;
      gl_FragColor = vec4(s, 1.);
    }`,
});

// GRAVITATIONAL LENSING, in screen space.
//
// Not physically derived — a real null-geodesic trace is not worth the frame
// budget on a phone. It is the one visual cue that reads unmistakably as a
// black hole rather than a dark circle: light from behind bends around the
// edge, so the starfield smears into a ring instead of being occluded.
const compositeMat = new T.ShaderMaterial({
  uniforms: {
    tScene: { value: null }, tBloom: { value: null },
    holeUV: { value: new T.Vector2(.5, .5) },
    holeR: { value: 0.0 },
    aspect: { value: 1.0 },
    bloom: { value: 0.85 },
    time: { value: 0 },
    onScreen: { value: 0 },
  },
  vertexShader: VERT,
  fragmentShader: `
    uniform sampler2D tScene, tBloom;
    uniform vec2 holeUV; uniform float holeR, aspect, bloom, time, onScreen;
    varying vec2 vUv;
    void main(){
      vec2 uv = vUv;
      if (onScreen > .5 && holeR > 0.0001) {
        vec2 d = uv - holeUV; d.x *= aspect;
        float r = max(length(d), 1e-4);
        // Falls off as 1/r, pulling the background inward toward the horizon.
        float pull = holeR * holeR / (r * r + holeR * .35);
        pull = min(pull, 0.42);
        vec2 off = normalize(d) * pull * holeR * 1.5;
        uv -= vec2(off.x / aspect, off.y);
      }
      vec3 col = texture2D(tScene, uv).rgb;
      col += texture2D(tBloom, vUv).rgb * bloom;

      // Vignette, a touch of warmth at the edges, and film grain fine enough
      // to kill the banding that smooth gradients show on an 8-bit display.
      float v = distance(vUv, vec2(.5)) ;
      col *= 1.0 - smoothstep(.42, .95, v) * .72;
      float g = fract(sin(dot(vUv * (time * .0007 + 1.0), vec2(12.9898, 78.233))) * 43758.5453);
      col += (g - .5) * .022;
      gl_FragColor = vec4(col, 1.);
    }`,
});

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  sizeTargets();
});

// ---------------------------------------------------------------- flight
let flight = null;
let holePulse = 0;
const UP = new T.Vector3(0, 1, 0);
const tmp = new T.Vector3();
const lookAt = new T.Vector3(0, 0, 0);
const qTarget = new T.Quaternion();
const mLook = new T.Matrix4();
let bank = 0;

// SPEED IS THE PILOT'S, NOT MINE.
//
// Base durations are roughly double what they were: the old flight read as a
// jump cut on short hops and gave the eye nothing to track. Drift is for
// watching, Burn for when you already know where you are going, and the
// choice is remembered because re-picking it every visit would be a tax.
const SPEEDS = { "0.55": "DRIFT", "1": "CRUISE", "2.1": "BURN" };
let speed = 1;
try { speed = Number(localStorage.getItem("endless_speed")) || 1; } catch {}
function setSpeed(v) {
  speed = v;
  for (const b of document.querySelectorAll("#throttle button"))
    b.setAttribute("aria-pressed", String(Number(b.dataset.sp) === v));
  try { localStorage.setItem("endless_speed", String(v)); } catch {}
}
for (const b of document.querySelectorAll("#throttle button"))
  b.onclick = () => setSpeed(Number(b.dataset.sp));
setSpeed(speed);

// Out and around rather than straight in: a lateral bow plus a climb, so the
// destination swings across the glass as you close instead of simply growing.
function legTo(from, to) {
  const dir = to.clone().sub(from);
  const len = Math.max(1, dir.length());
  const side = new T.Vector3().crossVectors(dir, UP).normalize().multiplyScalar(len * .28);
  const up = UP.clone().multiplyScalar(len * .17);
  return new T.CatmullRomCurve3([
    from.clone(),
    from.clone().lerp(to, .26).add(side).add(up),
    from.clone().lerp(to, .70).add(side.multiplyScalar(.40)).add(up.multiplyScalar(.5)),
    to.clone(),
  ]);
}

const durationFor = (dist) => (2600 + Math.min(5200, dist * 8)) / speed;

// Stop SHORT of a body, on the far side from the centre, so you arrive facing
// the tool with the black hole behind it and the tether crossing the view.
function approachPoint(b) {
  const p = bodyPos(b);
  return p.clone().add(p.clone().normalize().multiplyScalar(b.radius * 5 + 18))
          .add(new T.Vector3(0, b.radius * 1.8, 0));
}

function beginFlight(stops, opts) {
  const first = stops[0];
  flight = {
    curve: legTo(camera.position.clone(), first.point), t: 0,
    dur: durationFor(camera.position.distanceTo(first.point)),
    phase: "out", wait: 0, stops: stops.slice(1), target: first, ...opts,
  };
}

// ---------------------------------------------------------------- hud
let hudAt = 0;
function hud(now) {
  if (now - hudAt < 90) return;
  hudAt = now;
  const range = Math.round(camera.position.distanceTo(home));
  const flying = flight && flight.phase !== "arrive";
  $("#tRange").textContent = range;
  $("#tState").textContent = range < 85 ? "MOORED" : "HELD";
  $("#tBar").style.width = Math.min(100, range / 6) + "%";
  const v = flying ? Math.round((200 + 1500 * Math.sin(Math.PI * Math.min(1, flight.t))) * speed) : 0;
  $("#tVel").textContent = v;
  $("#vBar").style.width = Math.min(100, v / 34) + "%";
  $("#tTarget").textContent = flight
    ? String(flight.target.name ?? "OPEN SPACE").slice(0, 16).toUpperCase()
    : "HOLDING";
}

// ---------------------------------------------------------------- loop
let last = performance.now();
const screenPos = new T.Vector3();

function frame(now) {
  const dt = Math.min(48, now - last); last = now;
  const s = dt / 1000;

  for (const b of bodies) {
    b.a += b.rate * s;
    b.group.position.copy(bodyPos(b));
    b.mesh.rotation.y += .1 * s;
    if (b.pulse > 0) b.pulse = Math.max(0, b.pulse - s * .7);
    b.mesh.scale.setScalar(1 + b.pulse * .16);
    for (const m of b.moons) {
      m.a += m.rate * s;
      m.mesh.position.set(Math.cos(m.a) * m.d, Math.sin(m.a) * m.d * .3, Math.sin(m.a) * m.d);
    }
  }
  webCloud.a += webCloud.rate * s;
  webCloud.group.position.copy(bodyPos(webCloud));
  webCloud.group.rotation.y += .04 * s;

  // Differential rotation is the entire reason the disc is particles.
  for (let i = 0; i < DISC_N; i++) {
    const r = discDat[i*3];
    discDat[i*3+1] += discDat[i*3+2] * s;
    const a = discDat[i*3+1];
    discPos[i*3] = Math.cos(a) * r;
    discPos[i*3+1] = (Math.random() - .5) * .34;
    discPos[i*3+2] = Math.sin(a) * r;
  }
  discGeo.attributes.position.needsUpdate = true;

  if (holePulse > 0) holePulse = Math.max(0, holePulse - s * .6);
  glow.scale.setScalar(HORIZON * (11 + holePulse * 8));
  keyLight.intensity = 2200 + holePulse * 4200;
  compositeMat.uniforms.bloom.value = .85 + holePulse * .9;

  // ------------------------------------------------ fly
  let targetBank = 0;
  if (flight) {
    const f = flight;
    if (f.phase === "out" || f.phase === "home") {
      f.t = Math.min(1, f.t + dt / f.dur);
      const e = ease(f.t);
      camera.position.copy(f.curve.getPoint(e));
      const ahead = f.curve.getPoint(Math.min(1, e + .05));
      lookAt.lerp(f.phase === "home" ? home : ahead, .11);

      // BANK INTO THE TURN. The curve bows sideways; without roll the horizon
      // stays dead level through it and the whole thing reads as a dolly on
      // rails rather than as something flying.
      const p0 = f.curve.getPoint(Math.max(0, e - .04));
      const p1 = f.curve.getPoint(Math.min(1, e + .04));
      const v0 = camera.position.clone().sub(p0);
      const v1 = p1.clone().sub(camera.position);
      const turn = new T.Vector3().crossVectors(v0, v1);
      targetBank = Math.max(-.55, Math.min(.55, turn.y * .00035));

      if (f.t >= 1) {
        if (f.phase === "home") { f.onDone?.(); flight = null; }
        else {
          f.phase = "arrive"; f.wait = 0;
          if (f.target.body) f.target.body.pulse = 1;
          if (!f.stops.length) f.onArrive?.();
        }
      }
    } else {
      f.wait += dt;
      if (f.target.body) lookAt.lerp(f.target.body.group.position ?? home, .05);
      // Longer at the end of a journey than between stops: the last one is
      // where the answer appears and reading it should not be a race.
      const dwell = (f.stops.length ? 900 : (f.mode === "gap" ? 2400 : 2000)) / Math.max(.8, speed);
      if (f.wait > dwell) {
        if (f.stops.length) {
          const next = f.stops.shift();
          f.curve = legTo(camera.position.clone(), next.point);
          f.t = 0; f.phase = "out"; f.target = next;
          f.dur = durationFor(camera.position.distanceTo(next.point)) * .85;
        } else {
          f.curve = legTo(camera.position.clone(), MOORING);
          f.t = 0; f.phase = "home";
          f.dur = durationFor(camera.position.distanceTo(MOORING));
        }
      }
    }
  } else {
    lookAt.lerp(home, .035);
    camera.position.y = lerp(camera.position.y, MOORING.y + Math.sin(now * .0002) * 4.5, .015);
  }

  // Orientation by slerp rather than lookAt(), so roll is possible at all and
  // so a change of heading eases instead of snapping.
  bank = lerp(bank, targetBank, 1 - Math.pow(.004, s));
  const up = UP.clone().applyAxisAngle(
    tmp.copy(lookAt).sub(camera.position).normalize(), bank);
  mLook.lookAt(camera.position, lookAt, up);
  qTarget.setFromRotationMatrix(mLook);
  camera.quaternion.slerp(qTarget, 1 - Math.pow(.0009, s));

  // The tether, from just under the nose rather than the exact centre of the
  // screen, so it reads as coming off the ship and not out of your eye.
  camera.getWorldDirection(tmp);
  const nose = camera.position.clone().addScaledVector(tmp, 7)
    .addScaledVector(UP.clone().applyQuaternion(camera.quaternion), -2.4);
  const tp = tetherGeo.attributes.position;
  tp.setXYZ(0, nose.x, nose.y, nose.z);
  tp.setXYZ(1, home.x, home.y, home.z);
  tp.needsUpdate = true;
  tether.material.opacity = .26 + .2 * (.5 + .5 * Math.sin(now * .0026));

  // ------------------------------------------------ where the hole is, on screen
  screenPos.copy(home).project(camera);
  const behind = screenPos.z > 1;
  const dist = camera.position.distanceTo(home);
  // Angular size of the horizon, as a fraction of the viewport height.
  const ang = Math.atan2(HORIZON * 1.9, Math.max(1, dist));
  const fovRad = camera.fov * Math.PI / 180;
  compositeMat.uniforms.holeUV.value.set(screenPos.x * .5 + .5, screenPos.y * .5 + .5);
  compositeMat.uniforms.holeR.value = Math.min(.5, ang / fovRad);
  compositeMat.uniforms.aspect.value = camera.aspect;
  compositeMat.uniforms.onScreen.value = behind ? 0 : 1;
  compositeMat.uniforms.time.value = now;

  // ------------------------------------------------ draw
  renderer.setRenderTarget(rtScene);
  renderer.clear();
  renderer.render(scene, camera);

  brightMat.uniforms.tDiffuse.value = rtScene.texture;
  pass(brightMat, rtA);

  blurMat.uniforms.res.value.set(rtA.width, rtA.height);
  blurMat.uniforms.tDiffuse.value = rtA.texture;
  blurMat.uniforms.dir.value.set(1, 0);
  pass(blurMat, rtB);
  blurMat.uniforms.tDiffuse.value = rtB.texture;
  blurMat.uniforms.dir.value.set(0, 1);
  pass(blurMat, rtA);

  compositeMat.uniforms.tScene.value = rtScene.texture;
  compositeMat.uniforms.tBloom.value = rtA.texture;
  pass(compositeMat, null);

  hud(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------------------------------------------------------- asking
const panel = $("#panel");
const setStatus = (s) => { $("#status").textContent = s ?? ""; };
const hidePanel = () => panel.classList.remove("up");
const showPanel = (h) => { panel.innerHTML = h; panel.classList.add("up"); };

async function mcp(name, args) {
  const res = await fetch("/api/mcp", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ name, arguments: args }),
  });
  const body = await res.json();
  if (body.error && !body.result) throw new Error(body.error.message ?? body.error);
  const block = body.result?.content?.[0]?.text;
  if (body.result?.isError) throw new Error(block || "failed");
  try { return JSON.parse(block); } catch { return { raw: block }; }
}

$("#go").onclick = ask;
$("#q").addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });

async function ask() {
  const q = $("#q").value.trim();
  if (!q || flight) return;
  $("#go").disabled = true;
  hidePanel();
  setStatus("transmitting…");

  let d;
  try { d = await mcp("endless_answer", { question: q }); }
  catch (e) { setStatus(e.message); $("#go").disabled = false; return; }

  // 1. ANSWERED IN PLACE. You do not move. The hole flares in front of you and
  // that is the whole journey — flying somewhere would be a lie about where
  // the answer came from, and showing the mechanism is why this exists.
  if (d.answered_by === "model") {
    holePulse = 1;
    setStatus(d.gap_logged ? "answered in place — but expensively" : "answered in place");
    showAnswer(q, d);
    $("#go").disabled = false;
    setTimeout(() => setStatus(""), 3400);
    return;
  }

  // 1b. OFF THE OPEN WEB. A gap as well as an answer: going to the internet
  // means no tool here covered it.
  if (d.answered_by === "web") {
    setStatus(`no tool covers that — searching the open web (${d.web_searches ?? 1})`);
    beginFlight([{
      body: webCloud, name: "THE OPEN WEB",
      point: bodyPos(webCloud).clone()
        .add(bodyPos(webCloud).clone().normalize().multiplyScalar(95))
        .add(new T.Vector3(0, 32, 0)),
    }], {
      mode: "find",
      onArrive: () => { setStatus(""); showAnswer(q, d); },
      onDone: () => { $("#go").disabled = false; },
    });
    return;
  }

  // DISTINCT tools, in the order first reached. Three calls to one tool is one
  // place to visit, not three identical flights.
  const seen = new Set();
  const stops = (d.calls ?? [])
    .map(c => c.tool_id)
    .filter(id => id && !seen.has(id) && seen.add(id))
    .map(id => bodies.find(b => b.tool_id === id))
    .filter(Boolean)
    .map(b => ({ body: b, point: approachPoint(b), name: b.name ?? b.tool_id }));

  // 3. NOBODY COULD. Out past every orbit, where the dust is.
  if (!stops.length) {
    const a = Math.random() * TAU, R = 470 + Math.random() * 120;
    const centre = new T.Vector3(Math.cos(a) * R, (Math.random() - .5) * 70, Math.sin(a) * R);
    setStatus("nothing out here does that — going to record it");
    beginFlight([{ point: centre.clone().add(new T.Vector3(0, 22, 74)), name: "OPEN SPACE" }], {
      mode: "gap",
      onArrive: () => {
        addGapCloud(centre, d.need ?? q, false);
        setStatus("recorded as a need nobody met");
        showPanel(`<p class="q">${esc(q)}</p>` +
          `<div class="gap">${esc(d.answer ?? "Recorded as a need nobody met.")}</div>` +
          `<div class="row"><button id="close">Close</button></div>`);
        $("#close").onclick = hidePanel;
      },
      onDone: () => { $("#go").disabled = false; },
    });
    return;
  }

  // 2. TOOLS DID IT. Fly the route; answer on reaching the LAST stop, because
  // the answer describes all of them.
  setStatus(stops.length > 1 ? `plotting ${stops.length} stops` : `heading for ${stops[0].name}`);
  beginFlight(stops, {
    mode: "find",
    onArrive: () => { setStatus(""); showAnswer(q, d); },
    onDone: () => { $("#go").disabled = false; },
  });
}

function showAnswer(q, d) {
  const n = (d.calls ?? []).length;
  const via = d.answered_by === "model"
    ? `answered by <b>Claude</b> — no tool needed` +
      (d.gap_logged ? `, but expensively, so it is logged as a tool worth having` : "")
    : d.answered_by === "web"
      ? `answered off <b>the open web</b> — ${d.web_searches ?? 1} search` +
        ((d.web_searches ?? 1) === 1 ? "" : "es") + `, no tool covered it`
    : n > 1 ? `answered from <b>${n} tool calls</b>`
            : `answered by <b>${esc(d.tool_name ?? d.tool_id)}</b>${d.ms ? ` · ${esc(d.ms)}ms` : ""}`;

  showPanel(
    `<p class="q">${esc(q)}</p>` +
    `<p class="a">${esc(d.answer ?? "")}</p>` +
    `<p class="via">${via}</p>` +
    (d.error ? `<div class="gap" style="margin-top:9px">${esc(d.error)}</div>` : "") +
    (d.answered_by === "web"
      ? `<div class="gap" style="margin-top:10px">Recorded as a tool worth building — nothing here covered it.` +
        ((d.web_queries ?? []).length
          ? `<br><span style="opacity:.75">searched: ${d.web_queries.map(esc).join(" · ")}</span>` : "") +
        `</div>` : "") +
    (n ? `<details><summary>what it ran, and what came back</summary>` +
         d.calls.map(c => `<pre>${esc(c.tool_id + " " + JSON.stringify(c.input))}\n` +
           `${esc(JSON.stringify(c.error ? { error: c.error } : c.result, null, 2))}</pre>`).join("") +
         `</details>` : "") +
    `<div class="row"><button id="close">Close</button></div>`);
  $("#close").onclick = hidePanel;
}

load().then(() => {
  $("#boot").classList.add("gone");
  setStatus(`${bodies.length} worlds · ${gapClouds.length} unmet`);
  setTimeout(() => setStatus(""), 4200);
}).catch((e) => {
  $("#boot").textContent = "systems failed: " + e.message;
});
</script>
</body>
</html>
