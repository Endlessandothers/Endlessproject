<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Endless — the cockpit</title>
<style>
  :root{ --accent:#ED7100; --hud:rgba(255,190,120,.85); --dim:rgba(160,150,145,.6); --dust:#c98a3a; }
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{margin:0;background:#04040a;color:#ececf0;
       font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
       -webkit-user-select:none;user-select:none}
  canvas{display:block;position:fixed;inset:0;touch-action:none}

  /* ---------------------------------------------------------------- canopy
     The hull, drawn over the glass. It catches nothing: a frame that ate a tap
     meant for a world behind it would be a cockpit you cannot fly. */
  .canopy{position:fixed;inset:0;pointer-events:none;z-index:4}
  .canopy .glass{position:absolute;inset:0;
    background:
      radial-gradient(ellipse 120% 90% at 50% 46%, transparent 40%, rgba(0,0,0,.82) 100%),
      linear-gradient(180deg, rgba(255,150,60,.05) 0%, transparent 22%)}
  /* The struts. Real canopies have them, and they are most of why a view reads
     as "from inside something" rather than "a camera in space". */
  .strut.l{position:absolute;left:0;top:0;bottom:0;width:15vw;
    background:linear-gradient(90deg,rgba(20,16,15,.96) 0%,rgba(24,19,17,.7) 55%,transparent 100%)}
  .strut.r{position:absolute;right:0;top:0;bottom:0;width:15vw;
    background:linear-gradient(270deg,rgba(20,16,15,.96) 0%,rgba(24,19,17,.7) 55%,transparent 100%)}
  .strut.t{position:absolute;left:0;right:0;top:0;height:9vh;
    background:linear-gradient(180deg,rgba(18,14,13,.97) 0%,rgba(22,17,16,.55) 60%,transparent 100%)}
  /* The dash. The bottom of the frame is the console, so it is heavier and has
     a lit edge where instruments would throw light up onto the glass. */
  .dash{position:absolute;left:0;right:0;bottom:0;height:19vh;
    background:linear-gradient(0deg,#0b0908 0%,#151110 58%,rgba(24,19,17,.72) 88%,transparent 100%);
    border-top:1px solid rgba(237,113,0,.30);
    box-shadow:0 -14px 46px rgba(237,113,0,.09)}
  .dash:after{content:"";position:absolute;left:8%;right:8%;top:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,190,120,.6),transparent)}

  /* ---------------------------------------------------------------- readouts */
  .hud{position:fixed;z-index:6;pointer-events:none;
    font:11px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.09em;text-transform:uppercase;color:var(--hud);
    text-shadow:0 0 12px rgba(237,113,0,.45)}
  .hud .lbl{color:var(--dim);letter-spacing:.14em}
  .hud b{font-weight:600;color:#ffe2bd}
  #hudL{left:calc(2vw + 10px);bottom:4.5vh}
  #hudR{right:calc(2vw + 10px);bottom:4.5vh;text-align:right}
  .bar{width:104px;height:3px;background:rgba(255,190,120,.16);border-radius:2px;margin-top:3px}
  .bar i{display:block;height:100%;width:0;background:var(--hud);border-radius:2px;
    box-shadow:0 0 9px rgba(255,190,120,.8);transition:width .12s linear}
  #hudR .bar{margin-left:auto}

  /* ---------------------------------------------------------------- console */
  .console{position:fixed;left:50%;transform:translateX(-50%);bottom:5.2vh;z-index:7;
    width:min(560px,80vw);display:flex;flex-direction:column;gap:7px;align-items:center}
  .ask{display:flex;gap:7px;width:100%}
  .ask input{flex:1;min-width:0;padding:11px 15px;border-radius:9px;
    border:1px solid rgba(237,113,0,.34);background:rgba(10,8,10,.88);color:#ffe2bd;
    font:13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;
    box-shadow:inset 0 0 22px rgba(237,113,0,.07)}
  .ask input::placeholder{color:rgba(160,150,145,.55)}
  .ask input:focus{outline:0;border-color:rgba(255,190,120,.75)}
  .ask button{padding:11px 19px;border-radius:9px;border:1px solid rgba(237,113,0,.5);
    background:rgba(237,113,0,.9);color:#140d06;font:600 12px/1 ui-monospace,monospace;
    letter-spacing:.13em;text-transform:uppercase;cursor:pointer}
  .ask button:disabled{opacity:.4;cursor:default}
  .status{font:11px/1.5 ui-monospace,monospace;letter-spacing:.11em;text-transform:uppercase;
    color:var(--hud);min-height:1.3em;text-align:center;text-shadow:0 0 14px rgba(237,113,0,.5)}

  /* ---------------------------------------------------------------- panel */
  .panel{position:fixed;left:50%;transform:translateX(-50%) translateY(calc(100% + 60px));
    bottom:calc(5.2vh + 92px);width:min(560px,86vw);max-height:54vh;overflow:auto;z-index:8;
    background:rgba(9,8,12,.95);border:1px solid rgba(237,113,0,.3);border-radius:13px;
    padding:16px 18px;backdrop-filter:blur(10px);
    box-shadow:0 0 40px rgba(0,0,0,.7), inset 0 0 40px rgba(237,113,0,.05);
    transition:transform .4s cubic-bezier(.2,.8,.2,1)}
  .panel.up{transform:translateX(-50%) translateY(0)}
  .panel .q{font:11px/1.6 ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase;
    color:var(--dim);margin:0 0 8px}
  .panel .a{font-size:.97rem;line-height:1.62;margin:0 0 11px;color:#f0eae4}
  .panel .via{font:10px/1.6 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;
    color:var(--dim);margin:0}
  .panel .via b{color:var(--hud)}
  .panel .gap{border-left:2px solid var(--dust);padding-left:11px;color:var(--dust);font-size:.87rem}
  details{margin-top:11px}
  summary{font:10px/1.6 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;
    color:var(--dim);cursor:pointer;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary:before{content:"> ";color:var(--accent)}
  details[open] summary:before{content:"v ";color:var(--accent)}
  pre{margin:8px 0 0;background:#070609;border:1px solid rgba(237,113,0,.16);border-radius:7px;
    padding:10px;font:11px/1.55 ui-monospace,monospace;color:#b9d8c6;
    white-space:pre-wrap;word-break:break-word;max-height:26vh;overflow:auto}
  .panel .row{display:flex;gap:7px;margin-top:11px}
  .panel .row button{padding:8px 14px;border-radius:7px;border:1px solid rgba(237,113,0,.4);
    background:transparent;color:var(--hud);font:11px ui-monospace,monospace;
    letter-spacing:.09em;text-transform:uppercase;cursor:pointer}

  .brand{position:fixed;top:2.4vh;left:50%;transform:translateX(-50%);z-index:6;
    font:11px/1.6 ui-monospace,monospace;letter-spacing:.3em;text-transform:uppercase;
    color:rgba(255,190,120,.5);pointer-events:none;text-align:center}
  .brand a{color:rgba(160,150,145,.55);pointer-events:auto;letter-spacing:.1em;text-decoration:none}

  .boot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#04040a;
    font:12px ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--hud);
    transition:opacity .6s}
  .boot.gone{opacity:0;pointer-events:none}

  @media (max-width:640px){
    .strut.l,.strut.r{width:9vw}
    .hud{font-size:10px}
    #hudL,#hudR{bottom:3.4vh}
    .console{bottom:4vh;width:88vw}
    .brand{font-size:9px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="canopy">
  <div class="glass"></div>
  <div class="strut t"></div>
  <div class="strut l"></div>
  <div class="strut r"></div>
  <div class="dash"></div>
</div>

<div class="brand">ENDLESS<br><a href="/">plain page</a> · <a href="/flat">flat map</a></div>

<div class="hud" id="hudL">
  <div class="lbl">tether</div>
  <div><b id="tState">MOORED</b></div>
  <div class="lbl">range to claude</div>
  <div><b id="tRange">0</b></div>
  <div class="bar"><i id="tBar"></i></div>
</div>

<div class="hud" id="hudR">
  <div class="lbl">heading</div>
  <div><b id="tTarget">HOLDING</b></div>
  <div class="lbl">velocity</div>
  <div><b id="tVel">0</b></div>
  <div class="bar"><i id="vBar"></i></div>
</div>

<div class="console">
  <div class="ask">
    <input id="q" placeholder="ask anything — how strong is charizard?" autocomplete="off" spellcheck="false">
    <button id="go">Ask</button>
  </div>
  <div class="status" id="status"></div>
</div>

<div class="panel" id="panel"></div>
<div class="boot" id="boot">bringing systems up…</div>

<script type="module">
// THE COCKPIT, IN REAL 3D.
//
// This was a top-down canvas with a triangle flying across it, then the same
// canvas with the camera riding the triangle. Both were maps you looked at.
// This is a place you sit inside: a perspective camera behind a canopy, a black
// hole with real depth ahead of you, and tools on real inclined orbits you fly
// out to and come back from.
//
// WHY NOT UNREAL. It was asked for, and it is the wrong tool rather than a
// missing one. Unreal has had no browser target since HTML5 export was removed
// after 4.24, so the only way onto a web page is Pixel Streaming: render on a
// GPU server, send video. The smallest suitable AWS instance is around $380 a
// month against $0 here, it needs a session per viewer, and a phone on mobile
// data would get a laggy video of a cockpit rather than a cockpit. three.js
// renders on the device already in your hand.
//
// three.js is COPIED IN rather than loaded from a CDN, because this page's CSP
// says script-src 'self', and relaxing that on a page that holds an API key is
// a bad trade for saving two megabytes of transfer.

import * as T from "/vendor/three.module.js";

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;

// A stable number per tool id, so a world keeps its orbit and its colour
// between visits. A system that reshuffles on reload is one you cannot learn.
function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0);
}

// ---------------------------------------------------------------- scene
const renderer = new T.WebGLRenderer({ canvas: $("#c"), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x04040a, 1);

const scene = new T.Scene();
const camera = new T.PerspectiveCamera(62, innerWidth / innerHeight, 0.5, 20000);

// PARKED CLOSE. The hole should fill the glass the moment the page opens — it
// is the thing everything else is about, and a distant speck would make it
// scenery. This is the mooring the ship returns to.
const MOORING = new T.Vector3(0, 13, 62);
camera.position.copy(MOORING);

scene.add(new T.AmbientLight(0x3a3a52, 1.2));
const keyLight = new T.PointLight(0xffb066, 1400, 2600, 2);
scene.add(keyLight);                       // the hole lights its own system

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------------------------------------------------------------- starfield
{
  const N = 2600, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    // On a shell rather than in a cube, so there is no direction you can turn
    // and catch the sky running out.
    const u = Math.random() * 2 - 1, th = Math.random() * TAU, r = 2600 + Math.random() * 3200;
    const k = Math.sqrt(1 - u * u);
    pos[i*3] = Math.cos(th) * k * r; pos[i*3+1] = u * r; pos[i*3+2] = Math.sin(th) * k * r;
  }
  const g = new T.BufferGeometry();
  g.setAttribute("position", new T.BufferAttribute(pos, 3));
  scene.add(new T.Points(g, new T.PointsMaterial({
    color: 0xcfd4ff, size: 7, sizeAttenuation: true, transparent: true, opacity: .85,
  })));
}

// ---------------------------------------------------------------- glow sprite
const glowTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const x = c.getContext("2d");
  const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, "rgba(255,255,255,.95)");
  g.addColorStop(.28, "rgba(255,190,120,.45)");
  g.addColorStop(1, "rgba(237,113,0,0)");
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  return new T.CanvasTexture(c);
})();

// ---------------------------------------------------------------- black hole
const HORIZON = 7;
const hole = new T.Group();
scene.add(hole);

// The horizon. Pure black and unlit, so it stays a HOLE rather than becoming a
// dark ball with a highlight sliding over it.
hole.add(new T.Mesh(new T.SphereGeometry(HORIZON, 48, 32),
  new T.MeshBasicMaterial({ color: 0x000000 })));

// The photon ring: light that orbited before it escaped. Thin, and the
// brightest thing in here, because it is.
const photon = new T.Mesh(
  new T.TorusGeometry(HORIZON * 1.07, .13, 12, 160),
  new T.MeshBasicMaterial({ color: 0xffe0b2, transparent: true, opacity: .95,
    blending: T.AdditiveBlending, depthWrite: false }));
photon.rotation.x = Math.PI / 2;
hole.add(photon);

// The accretion disc as PARTICLES rather than a textured ring, because the
// inner edge has to visibly outrun the outer one and a rigid mesh cannot do
// that. Kepler again: angular speed falls off as r^-1.5.
const DISC_N = 5200;
const discPos = new Float32Array(DISC_N * 3);
const discCol = new Float32Array(DISC_N * 3);
const discDat = new Float32Array(DISC_N * 3);   // r, angle, rate
{
  const cIn = new T.Color(0xfff4e6), cMid = new T.Color(0xffb257), cOut = new T.Color(0xb8490a);
  for (let i = 0; i < DISC_N; i++) {
    const r = HORIZON * 1.32 + Math.pow(Math.random(), .58) * HORIZON * 4.4;
    const a = Math.random() * TAU;
    discDat[i*3] = r; discDat[i*3+1] = a;
    discDat[i*3+2] = 2.4 / Math.pow(r / (HORIZON * 1.32), 1.5);
    const heat = 1 - Math.min(1, (r - HORIZON * 1.32) / (HORIZON * 4.4));
    const c = heat > .55 ? cIn.clone().lerp(cMid, (1 - heat) / .45)
                         : cMid.clone().lerp(cOut, (.55 - heat) / .55);
    discCol[i*3] = c.r; discCol[i*3+1] = c.g; discCol[i*3+2] = c.b;
  }
}
const discGeo = new T.BufferGeometry();
discGeo.setAttribute("position", new T.BufferAttribute(discPos, 3));
discGeo.setAttribute("color", new T.BufferAttribute(discCol, 3));
hole.add(new T.Points(discGeo, new T.PointsMaterial({
  size: .55, vertexColors: true, transparent: true, opacity: .95,
  blending: T.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
})));

const glow = new T.Sprite(new T.SpriteMaterial({
  map: glowTex, blending: T.AdditiveBlending, depthWrite: false, transparent: true,
  color: 0xffa347,
}));
glow.scale.set(HORIZON * 10, HORIZON * 10, 1);
hole.add(glow);

// ---------------------------------------------------------------- labels
function labelSprite(text, colour, px) {
  const size = px ?? 42, pad = 14;
  const m = document.createElement("canvas").getContext("2d");
  m.font = `600 ${size}px ui-monospace, SFMono-Regular, Menlo, monospace`;
  const w = Math.ceil(m.measureText(text).width) + pad * 2;
  const c = document.createElement("canvas");
  c.width = w; c.height = size + 22;
  const g = c.getContext("2d");
  g.font = `600 ${size}px ui-monospace, SFMono-Regular, Menlo, monospace`;
  g.textBaseline = "middle";
  g.shadowColor = "rgba(0,0,0,.95)"; g.shadowBlur = 10;
  g.fillStyle = colour;
  g.fillText(text, pad, c.height / 2);
  const tex = new T.CanvasTexture(c);
  tex.minFilter = T.LinearFilter;
  const sp = new T.Sprite(new T.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sp.scale.set(w / c.height * 10, 10, 1);
  return sp;
}

// ---------------------------------------------------------------- the worlds
const bodies = [];
const gapClouds = [];
const home = new T.Vector3(0, 0, 0);

const bodyPos = (b) => new T.Vector3(
  Math.cos(b.a) * b.R, Math.sin(b.inc) * b.R * .32, Math.sin(b.a) * b.R);

async function load() {
  const [tj, gj] = await Promise.all([
    fetch("/api/board?file=tools").then(r => r.json()).catch(() => ({ tools: [] })),
    fetch("/api/board?file=gaps").then(r => r.json()).catch(() => ({ clusters: [] })),
  ]);

  const tools = tj.tools ?? [];
  const maxMass = Math.max(1, ...tools.map(t => t.live_mass ?? 0));
  const sorted = [...tools].sort((a, b) => (b.live_mass ?? 0) - (a.live_mass ?? 0));

  sorted.forEach((t, i) => {
    const h = hash(t.tool_id);
    const busy = Math.min(1, (t.live_mass ?? 0) / maxMass);
    const jitter = .74 + ((h >> 9) % 1000) / 1000 * .44;
    // Busy close in, quiet far out. Radius already encoded use, and decay
    // already pushes an unused tool outward — so the orbit a tool ends up in
    // IS its standing rather than a decoration laid over the data.
    const R = lerp(100, 380, Math.pow(1 - busy, .85)) * jitter;
    const a = i * 2.39996 + ((h % 1000) / 1000) * .5;
    // A little inclination each, so this is a system rather than a dinner
    // plate, and reaching one means climbing as well as travelling.
    const inc = ((h >> 4) % 1000) / 1000 * .36 - .18;

    const lit = t.brightness != null && (t.mass ?? 0) > 0;
    const radius = 3.6 + Math.sqrt(t.live_mass ?? 0) * 2.8;
    const hue = ((h >> 3) % 360) / 360;

    const mat = lit
      ? new T.MeshStandardMaterial({
          color: new T.Color().setHSL(hue, .60, .52),
          emissive: new T.Color().setHSL(hue, .72, .16 + (t.brightness ?? 0) * .2),
          roughness: .6, metalness: .12,
        })
      // Unlit is its own state, not a dimmer version of lit. Nothing is KNOWN
      // about whether these work, and drawing "no evidence" the same as "weak
      // evidence" would be the most misleading thing on the screen.
      : new T.MeshStandardMaterial({ color: 0x2c2c3a, emissive: 0x08080e, roughness: .95, metalness: .03 });

    const group = new T.Group();
    const mesh = new T.Mesh(new T.SphereGeometry(radius, 32, 22), mat);
    group.add(mesh);

    if (lit) {
      const hl = new T.Sprite(new T.SpriteMaterial({
        map: glowTex, blending: T.AdditiveBlending, depthWrite: false, transparent: true,
        color: new T.Color().setHSL(hue, .85, .58), opacity: .45 + (t.brightness ?? 0) * .3,
      }));
      hl.scale.set(radius * 8, radius * 8, 1);
      group.add(hl);
    }

    const lab = labelSprite(t.name ?? t.tool_id, lit ? "#ffe2bd" : "#8f8fa2");
    lab.position.y = radius + 8;
    group.add(lab);

    // Moons: tools built on this one. The whole reason a registry beats a list.
    const moons = [];
    for (let k = 0; k < Math.min(t.dependents ?? 0, 3); k++) {
      const m = new T.Mesh(new T.SphereGeometry(Math.max(.9, radius * .3), 14, 10),
        new T.MeshStandardMaterial({ color: 0xd8dcf0, roughness: .7 }));
      group.add(m);
      moons.push({ mesh: m, d: radius * 2.8 + k * radius, a: ((h >> (k + 2)) % 628) / 100, rate: .55 - k * .13 });
    }

    scene.add(group);
    bodies.push({ ...t, group, mesh, moons, lit, radius, R, a, inc, rate: 30 / Math.pow(R, 1.5), pulse: 0 });
  });

  // Gaps: dust out past every orbit, in the empty space that is the point of
  // them. Not yet a world, which is exactly the claim being made.
  (gj.clusters ?? []).forEach((cl) => {
    const h = hash(cl.id);
    const a = (h % 1000) / 1000 * TAU;
    const R = 460 + ((h >> 7) % 160);
    addGapCloud(
      new T.Vector3(Math.cos(a) * R, ((((h >> 5) % 100) / 100) - .5) * 90, Math.sin(a) * R),
      cl.label ?? "a need nobody met", cl.confirmed === true);
  });
}

function addGapCloud(centre, label, confirmed) {
  const N = confirmed ? 900 : 620;
  const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const u = Math.random() * 2 - 1, th = Math.random() * TAU;
    // A confirmed cluster is tighter: it has been asked enough times to have
    // begun collapsing toward something buildable.
    const r = (confirmed ? 7 : 12) + Math.pow(Math.random(), .5) * (confirmed ? 20 : 34);
    const k = Math.sqrt(1 - u * u);
    pos[i*3] = centre.x + Math.cos(th) * k * r;
    pos[i*3+1] = centre.y + u * r * .6;
    pos[i*3+2] = centre.z + Math.sin(th) * k * r;
  }
  const g = new T.BufferGeometry();
  g.setAttribute("position", new T.BufferAttribute(pos, 3));
  scene.add(new T.Points(g, new T.PointsMaterial({
    color: 0xc98a3a, size: confirmed ? 1.6 : 1.15, transparent: true,
    opacity: confirmed ? .7 : .4, blending: T.AdditiveBlending, depthWrite: false,
  })));
  const lab = labelSprite(String(label).slice(0, 34), "#c98a3a", 34);
  lab.position.copy(centre); lab.position.y += 36;
  scene.add(lab);
  gapClouds.push({ centre, confirmed });
}

// ---------------------------------------------------------------- the open web
//
// NOT A PLANET, DELIBERATELY. Every other body out here is a reviewed tool
// with a handler, an allowlist and a version. This one is the open internet:
// it runs inside the model's API, nobody here wrote it, nobody here approved
// it, and what comes back is whatever the web said today.
//
// So it is drawn as weather rather than as a world — a large, soft, drifting
// haze with no surface. You can fly to it and it answers, and it never quite
// resolves into something solid. That is the honest picture.
const webCloud = (() => {
  const group = new T.Group();
  const R = 300, N = 2200;
  const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const u = Math.random() * 2 - 1, th = Math.random() * TAU;
    const r = Math.pow(Math.random(), .42) * 26;
    const k = Math.sqrt(1 - u * u);
    pos[i*3] = Math.cos(th) * k * r;
    pos[i*3+1] = u * r * .8;
    pos[i*3+2] = Math.sin(th) * k * r;
  }
  const g = new T.BufferGeometry();
  g.setAttribute("position", new T.BufferAttribute(pos, 3));
  group.add(new T.Points(g, new T.PointsMaterial({
    color: 0x7fc4ff, size: 1.5, transparent: true, opacity: .42,
    blending: T.AdditiveBlending, depthWrite: false,
  })));
  const hl = new T.Sprite(new T.SpriteMaterial({
    map: glowTex, blending: T.AdditiveBlending, depthWrite: false,
    transparent: true, color: 0x66b0ff, opacity: .32,
  }));
  hl.scale.set(110, 110, 1);
  group.add(hl);
  const lab = labelSprite("the open web", "#9fd4ff");
  lab.position.y = 40;
  group.add(lab);
  scene.add(group);
  // Furthest out of anything that answers, and slowest, because it is not in
  // orbit around this system in any meaningful sense.
  return { group, R, a: 2.1, inc: .22, rate: 30 / Math.pow(R, 1.5), radius: 26 };
})();

// ---------------------------------------------------------------- the tether
//
// It is never not drawn. The ship goes out to a tool and comes back, and the
// line home says why: a tool is not where the answer lives, it is somewhere the
// model reached. Cut the tether and a tool is just an API. The whole argument
// this project makes is that the line is there.
const tetherGeo = new T.BufferGeometry();
tetherGeo.setAttribute("position", new T.BufferAttribute(new Float32Array(6), 3));
const tether = new T.Line(tetherGeo, new T.LineBasicMaterial({
  color: 0xffc078, transparent: true, opacity: .5, blending: T.AdditiveBlending, depthWrite: false,
}));
scene.add(tether);

// ---------------------------------------------------------------- flight
let flight = null;
let holePulse = 0;
const look = new T.Vector3(0, 0, 0);
const UP = new T.Vector3(0, 1, 0);
const tmp = new T.Vector3();

// Out and around rather than straight in: a lateral bow plus a climb, so the
// destination swings across the glass as you close instead of simply growing.
// Arriving should feel like arriving.
function legTo(from, to) {
  const dir = to.clone().sub(from);
  const len = Math.max(1, dir.length());
  const side = new T.Vector3().crossVectors(dir, UP).normalize().multiplyScalar(len * .24);
  const up = UP.clone().multiplyScalar(len * .15);
  return new T.CatmullRomCurve3([
    from.clone(),
    from.clone().lerp(to, .30).add(side).add(up),
    from.clone().lerp(to, .72).add(side.multiplyScalar(.42)).add(up.multiplyScalar(.55)),
    to.clone(),
  ]);
}

// Stop SHORT of a body, on the far side from the centre, so you arrive facing
// the tool with the black hole behind it and the tether crossing the view.
// That framing is the argument, drawn.
function approachPoint(b) {
  const p = bodyPos(b);
  return p.clone().add(p.clone().normalize().multiplyScalar(b.radius * 5 + 18))
          .add(new T.Vector3(0, b.radius * 1.8, 0));
}

function beginFlight(stops, opts) {
  const first = stops[0];
  flight = {
    curve: legTo(camera.position.clone(), first.point), t: 0,
    dur: 1500 + Math.min(2800, camera.position.distanceTo(first.point) * 5),
    phase: "out", wait: 0, stops: stops.slice(1), target: first, ...opts,
  };
}

// ---------------------------------------------------------------- hud
let hudAt = 0;
function hud(now) {
  if (now - hudAt < 90) return;
  hudAt = now;
  const range = Math.round(camera.position.distanceTo(home));
  const flying = flight && flight.phase !== "arrive";
  $("#tRange").textContent = range;
  $("#tState").textContent = range < 80 ? "MOORED" : "HELD";
  $("#tBar").style.width = Math.min(100, range / 6) + "%";
  const v = flying ? Math.round(240 + 1400 * Math.sin(Math.PI * Math.min(1, flight.t))) : 0;
  $("#tVel").textContent = v;
  $("#vBar").style.width = Math.min(100, v / 17) + "%";
  $("#tTarget").textContent = flight
    ? String(flight.target.name ?? "OPEN SPACE").slice(0, 18).toUpperCase()
    : "HOLDING";
}

// ---------------------------------------------------------------- loop
let last = performance.now();

function frame(now) {
  const dt = Math.min(48, now - last); last = now;
  const s = dt / 1000;

  for (const b of bodies) {
    b.a += b.rate * s;
    b.group.position.copy(bodyPos(b));
    b.mesh.rotation.y += .14 * s;
    if (b.pulse > 0) b.pulse = Math.max(0, b.pulse - s * .8);
    b.mesh.scale.setScalar(1 + b.pulse * .2);
    for (const m of b.moons) {
      m.a += m.rate * s;
      m.mesh.position.set(Math.cos(m.a) * m.d, Math.sin(m.a) * m.d * .3, Math.sin(m.a) * m.d);
    }
  }

  webCloud.a += webCloud.rate * s;
  webCloud.group.position.copy(bodyPos(webCloud));
  webCloud.group.rotation.y += .05 * s;

  // Differential rotation is the entire reason the disc is particles.
  for (let i = 0; i < DISC_N; i++) {
    const r = discDat[i*3];
    discDat[i*3+1] += discDat[i*3+2] * s;
    const a = discDat[i*3+1];
    discPos[i*3] = Math.cos(a) * r;
    discPos[i*3+1] = (Math.random() - .5) * .3;   // a little thickness
    discPos[i*3+2] = Math.sin(a) * r;
  }
  discGeo.attributes.position.needsUpdate = true;

  if (holePulse > 0) holePulse = Math.max(0, holePulse - s * .7);
  glow.scale.setScalar(HORIZON * (10 + holePulse * 7));
  keyLight.intensity = 1400 + holePulse * 3200;

  if (flight) {
    const f = flight;
    if (f.phase === "out" || f.phase === "home") {
      f.t = Math.min(1, f.t + dt / f.dur);
      const e = ease(f.t);
      camera.position.copy(f.curve.getPoint(e));
      // Look where you are GOING, not at where you will end up: aiming at the
      // endpoint turns the whole approach into a slow zoom.
      look.lerp(f.phase === "home" ? home : f.curve.getPoint(Math.min(1, e + .05)), .15);
      if (f.t >= 1) {
        if (f.phase === "home") { f.onDone?.(); flight = null; }
        else {
          f.phase = "arrive"; f.wait = 0;
          if (f.target.body) f.target.body.pulse = 1;
          if (!f.stops.length) f.onArrive?.();
        }
      }
    } else {
      f.wait += dt;
      if (f.target.body) look.lerp(f.target.body.group.position, .07);
      const dwell = f.stops.length ? 750 : (f.mode === "gap" ? 2200 : 1700);
      if (f.wait > dwell) {
        if (f.stops.length) {
          const next = f.stops.shift();
          f.curve = legTo(camera.position.clone(), next.point);
          f.t = 0; f.phase = "out"; f.target = next;
          f.dur = 1200 + Math.min(2400, camera.position.distanceTo(next.point) * 5);
        } else {
          f.curve = legTo(camera.position.clone(), MOORING);
          f.t = 0; f.phase = "home";
          f.dur = 1600 + Math.min(2800, camera.position.distanceTo(MOORING) * 4);
        }
      }
    }
  } else {
    // Idle: a slow swell so the cockpit is never a still photograph.
    look.lerp(home, .05);
    camera.position.y = lerp(camera.position.y, MOORING.y + Math.sin(now * .00022) * 4, .02);
  }

  camera.lookAt(look);

  // From just under the nose rather than from the exact centre of the screen,
  // so it reads as coming off the ship instead of out of your eye.
  camera.getWorldDirection(tmp);
  const nose = camera.position.clone().addScaledVector(tmp, 7).add(new T.Vector3(0, -2.4, 0));
  const tp = tetherGeo.attributes.position;
  tp.setXYZ(0, nose.x, nose.y, nose.z);
  tp.setXYZ(1, home.x, home.y, home.z);
  tp.needsUpdate = true;
  tether.material.opacity = .28 + .22 * (.5 + .5 * Math.sin(now * .003));

  hud(now);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------------------------------------------------------- asking
const panel = $("#panel");
const setStatus = (s) => { $("#status").textContent = s ?? ""; };
const hidePanel = () => panel.classList.remove("up");
const showPanel = (h) => { panel.innerHTML = h; panel.classList.add("up"); };

async function mcp(name, args) {
  const res = await fetch("/api/mcp", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ name, arguments: args }),
  });
  const body = await res.json();
  if (body.error && !body.result) throw new Error(body.error.message ?? body.error);
  const block = body.result?.content?.[0]?.text;
  if (body.result?.isError) throw new Error(block || "failed");
  try { return JSON.parse(block); } catch { return { raw: block }; }
}

$("#go").onclick = ask;
$("#q").addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });

async function ask() {
  const q = $("#q").value.trim();
  if (!q || flight) return;
  $("#go").disabled = true;
  hidePanel();
  setStatus("transmitting…");

  let d;
  try { d = await mcp("endless_answer", { question: q }); }
  catch (e) { setStatus(e.message); $("#go").disabled = false; return; }

  // 1. ANSWERED IN PLACE. You do not move. The hole flares in front of you and
  // that is the whole journey — flying somewhere would be a lie about where the
  // answer came from, and showing the mechanism is why this exists over a list.
  if (d.answered_by === "model") {
    holePulse = 1;
    setStatus(d.gap_logged ? "answered in place — but expensively" : "answered in place");
    showAnswer(q, d);
    $("#go").disabled = false;
    setTimeout(() => setStatus(""), 3400);
    return;
  }

  // 1b. OFF THE OPEN WEB. Fly out to the haze. This is a gap as well as an
  // answer: going to the internet means no tool here covered it, and somebody
  // could wrap that source into one that is structured, fast and cheap.
  if (d.answered_by === "web") {
    setStatus(`no tool covers that — searching the open web (${d.web_searches ?? 1})`);
    beginFlight([{
      body: webCloud, name: "THE OPEN WEB",
      point: bodyPos(webCloud).clone()
        .add(bodyPos(webCloud).clone().normalize().multiplyScalar(90))
        .add(new T.Vector3(0, 30, 0)),
    }], {
      mode: "find",
      onArrive: () => { setStatus(""); showAnswer(q, d); },
      onDone: () => { $("#go").disabled = false; },
    });
    return;
  }

  // DISTINCT tools, in the order first reached. Three calls to one tool is one
  // place to visit, not three identical flights.
  const seen = new Set();
  const stops = (d.calls ?? [])
    .map(c => c.tool_id)
    .filter(id => id && !seen.has(id) && seen.add(id))
    .map(id => bodies.find(b => b.tool_id === id))
    .filter(Boolean)
    .map(b => ({ body: b, point: approachPoint(b), name: b.name ?? b.tool_id }));

  // 3. NOBODY COULD. Out past every orbit, where the dust is.
  if (!stops.length) {
    const a = Math.random() * TAU, R = 470 + Math.random() * 120;
    const centre = new T.Vector3(Math.cos(a) * R, (Math.random() - .5) * 70, Math.sin(a) * R);
    setStatus("nothing out here does that — going to record it");
    beginFlight([{ point: centre.clone().add(new T.Vector3(0, 20, 70)), name: "OPEN SPACE" }], {
      mode: "gap",
      onArrive: () => {
        addGapCloud(centre, d.need ?? q, false);
        setStatus("recorded as a need nobody met");
        showPanel(`<p class="q">${esc(q)}</p>` +
          `<div class="gap">${esc(d.answer ?? "Recorded as a need nobody met.")}</div>` +
          `<div class="row"><button id="close">Close</button></div>`);
        $("#close").onclick = hidePanel;
      },
      onDone: () => { $("#go").disabled = false; },
    });
    return;
  }

  // 2. TOOLS DID IT. Fly the whole route; answer on reaching the LAST stop,
  // because the answer describes all of them.
  setStatus(stops.length > 1 ? `plotting ${stops.length} stops` : `heading for ${stops[0].name}`);
  beginFlight(stops, {
    mode: "find",
    onArrive: () => { setStatus(""); showAnswer(q, d); },
    onDone: () => { $("#go").disabled = false; },
  });
}

function showAnswer(q, d) {
  const n = (d.calls ?? []).length;
  const via = d.answered_by === "model"
    ? `answered by <b>Claude</b> — no tool needed` +
      (d.gap_logged ? `, but expensively, so it is logged as a tool worth having` : "")
    : d.answered_by === "web"
      ? `answered off <b>the open web</b> — ${d.web_searches ?? 1} search` +
        ((d.web_searches ?? 1) === 1 ? "" : "es") + `, no tool covered it`
    : n > 1 ? `answered from <b>${n} tool calls</b>`
            : `answered by <b>${esc(d.tool_name ?? d.tool_id)}</b>${d.ms ? ` · ${esc(d.ms)}ms` : ""}`;

  showPanel(
    `<p class="q">${esc(q)}</p>` +
    `<p class="a">${esc(d.answer ?? "")}</p>` +
    `<p class="via">${via}</p>` +
    (d.error ? `<div class="gap" style="margin-top:9px">${esc(d.error)}</div>` : "") +
    // The searches it ran, verbatim. An answer off the open web is the one kind
    // here with no reviewed code behind it, so what it asked for is the only
    // thing a reader can check it against.
    (d.answered_by === "web"
      ? `<div class="gap" style="margin-top:10px">Recorded as a tool worth building — nothing here covered it.` +
        ((d.web_queries ?? []).length
          ? `<br><span style="opacity:.75">searched: ${d.web_queries.map(esc).join(" · ")}</span>` : "") +
        `</div>` : "") +
    (n ? `<details><summary>what it ran, and what came back</summary>` +
         d.calls.map(c => `<pre>${esc(c.tool_id + " " + JSON.stringify(c.input))}\n` +
           `${esc(JSON.stringify(c.error ? { error: c.error } : c.result, null, 2))}</pre>`).join("") +
         `</details>` : "") +
    `<div class="row"><button id="close">Close</button></div>`);
  $("#close").onclick = hidePanel;
}

load().then(() => {
  $("#boot").classList.add("gone");
  setStatus(`${bodies.length} worlds · ${gapClouds.length} unmet`);
  setTimeout(() => setStatus(""), 4200);
}).catch((e) => {
  $("#boot").textContent = "systems failed: " + e.message;
});
</script>
</body>
</html>
