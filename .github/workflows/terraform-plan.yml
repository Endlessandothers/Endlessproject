name: terraform plan

# Runs on every PR and every non-default branch. Read-only: this workflow can
# never change infrastructure, because the role it assumes has no write
# permissions at all.

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-*.yml"
  push:
    branches-ignore:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform-*.yml"
  workflow_dispatch:

# id-token: write is what lets GitHub mint the OIDC token. It does NOT grant
# write access to anything in the repository.
permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.15.8"
  AWS_REGION: us-east-1
  # Not a secret: an ARN is useless without an OIDC token matching the trust policy.
  PLAN_ROLE: arn:aws:iam::258506450105:role/endless-gha-plan
  WORKDIR: infra

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Assume read-only AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PLAN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}

      - name: Format check
        id: fmt
        working-directory: ${{ env.WORKDIR }}
        run: terraform fmt -check -recursive -diff

      - name: Init
        working-directory: ${{ env.WORKDIR }}
        run: terraform init -input=false

      - name: Validate
        working-directory: ${{ env.WORKDIR }}
        run: terraform validate -no-color

      # -lock=false because the plan role deliberately cannot write the lock
      # object. Trade-off: a plan racing a concurrent apply could read stale
      # state. Acceptable for a PR preview; apply always takes a real lock.
      - name: Plan
        id: plan
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -o pipefail
          terraform plan -input=false -lock=false -no-color 2>&1 | tee plan.txt
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('${{ env.WORKDIR }}/plan.txt', 'utf8');
            const LIMIT = 60000;
            if (plan.length > LIMIT) {
              plan = plan.slice(0, LIMIT) + '\n\n...truncated, see the workflow log for the full plan.';
            }
            const body = [
              '### Terraform plan — `${{ env.WORKDIR }}`',
              '',
              'Read-only role, `-lock=false`. Apply runs separately and takes a real lock.',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Upload plan log
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ github.run_id }}
          path: ${{ env.WORKDIR }}/plan.txt
          retention-days: 7
